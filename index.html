<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#12151a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Drift Park V9</title>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Parking Drift Tech Demo"></canvas>
    <div id="debug"></div>
    <div id="hint">DRIFT PARK · V9</div>
    <div id="toolbar"><button id="camera-button">Камера: сверху</button><button id="map-button">Карта</button><button id="reset-button">На старт</button><button id="mute-button" aria-label="Выключить звук">Звук</button></div>
    <canvas id="minimap" width="180" height="160" aria-label="Мини-карта"></canvas>
    <div id="game-controls">
    <div id="stick" class="control"><span></span></div>
    <div id="pedals">
      <button id="brake" class="button brake">Тормоз</button>
      <button id="handbrake" class="button handbrake">Ручник</button>
      <button id="throttle" class="button throttle">Газ</button>
    </div>
    </div>
    <div id="pwa-status" role="status"></div>
    <button id="update-button" hidden>Обновить игру</button>
    <section id="map-panel" hidden role="dialog" aria-label="Секции полигона" aria-modal="true">
      <div class="panel"><div class="panel-title">DRIFT PARK <button id="close-map">Вернуться</button></div><p>Свободная езда · выбери секцию для старта</p><div id="section-buttons"></div><p class="install-hint">iPhone: Safari → Поделиться → На экран «Домой»</p></div>
    </section>
  </main>
  <script type="module" src="pwa.js"></script>
  <script type="module">import('./game.js').catch(error=>{document.querySelector('#debug').textContent='Не удалось загрузить игру.\nДля первого запуска нужен интернет.\n'+error.message;});</script>
</body>
</html>
