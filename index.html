<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка имени</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
input, button {
    font-size: 18px;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
}
button {
    cursor: pointer;
    border: none;
    background: #667eea;
    color: white;
}
#result {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>

<body>
<div class="card">
    <h1>Напиши свое имя</h1>
    <input id="name" placeholder="Имя">
    <br>
    <button onclick="checkName()">Проверить</button>
    <div id="result"></div>
</div>

<script>
function checkName() {
    const name = document.getElementById("name").value.trim();

    if (name === "Никита") {
        document.getElementById("result").innerHTML = "Ты лох 😁";
    } else {
        document.getElementById("result").innerHTML = "Не верно";
    }
}
</script>
</body>
</html>
