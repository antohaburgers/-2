<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка имени</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2, #ff6b6b);
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 430px;
    background: rgba(255,255,255,0.95);
    padding: 35px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

h1 {
    color: #333;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    border-radius: 15px;
    border: 2px solid #ddd;
    outline: none;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(90deg,#ff416c,#ff4b2b);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.message {
    margin-top: 20px;
    min-height: 40px;
    font-size: 20px;
    font-weight: bold;
}

.timer {
    font-size: 35px;
    color: #ff416c;
    font-weight: bold;
}

.hidden {
    display: none;
}

.final {
    font-size: 45px;
    color: #ff1744;
    font-weight: 900;
    animation: shake .5s infinite;
}

@keyframes shake {
    0% {transform:rotate(0)}
    25% {transform:rotate(5deg)}
    50% {transform:rotate(-5deg)}
    75% {transform:rotate(5deg)}
    100% {transform:rotate(0)}
}

.emoji {
    font-size: 60px;
}
</style>
</head>

<body>

<div class="card">

<div id="start">
    <div class="emoji">🔍</div>
    <h1>Введите имя</h1>
    <input id="name" placeholder="Например: Никита">
    <button onclick="checkName()">Проверить</button>
    <div class="message" id="error"></div>
</div>

<div id="game" class="hidden">
    <h1>Идет проверка...</h1>
    <div class="timer" id="timer">60</div>
    <div class="message" id="status"></div>
</div>

<div id="result" class="hidden">
    <h1>Проверка завершена</h1>
    <div id="count"></div>
    <div class="final hidden">ТЫ ЛОХ!!! 😂</div>
</div>

</div>

<script>
const names = [
"никита",
"никитка",
"никитос",
"ник",
"никитон"
];

const texts = [
"Идет проверка...",
"Шуршит компьютер...",
"Компьютер думает...",
"Запускаем систему...",
"Загружаем данные...",
"Что-то считается...",
"Почти готово...",
"Еще немного..."
];

function checkName() {
    const input = document.getElementById("name");
    const value = input.value.trim().toLowerCase();

    if (!names.includes(value)) {
        document.getElementById("error").innerHTML =
        "❌ Не верно<br>Попробуйте Никита";
        return;
    }

    start();
}

function start() {
    document.getElementById("start").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    let seconds = 60;

    const timer = document.getElementById("timer");
    const status = document.getElementById("status");

    const interval = setInterval(() => {
        seconds--;
        timer.innerHTML = seconds;
        status.innerHTML = texts[Math.floor(Math.random()*texts.length)];

        if(seconds <= 0) {
            clearInterval(interval);
            finish();
        }
    },1000);
}

function finish() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    let n = 3;
    const count = document.getElementById("count");

    const interval = setInterval(()=>{
        count.innerHTML = "<h1>"+n+"</h1>";
        n--;

        if(n < 0){
            clearInterval(interval);
            count.innerHTML="";
            document.querySelector(".final").classList.remove("hidden");
        }
    },1000);
}
</script>

</body>
</html>
